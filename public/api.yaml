openapi: 3.0.3
info:
  title: SHU API
  description: SHU API Documentation
  version: 1.0.0
  contact:
    name: SHU Foundation
servers:
  - url: http://localhost:2354
    description: Development Server
paths:
  /:
    get:
      tags:
        - Health
      summary: Health Check
      description: Kiểm tra xem server có đang chạy không
      operationId: getIndex
  /api/ws/device/{deviceId}:
    ws:
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      operationId: wsApiWsDeviceByDeviceId
  /api/ws/client:
    ws:
      parameters:
        - name: token
          in: query
          required: true
          schema:
            description: User JWT token
            type: string
        - name: deviceId
          in: query
          required: false
          schema:
            description: Specific device to watch
            type: string
      operationId: wsApiWsClient
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản mới
      description: Tạo tài khoản người dùng mới với email, tên người dùng và mật khẩu.
        Một email xác minh sẽ được gửi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - confirmPassword
              properties:
                username:
                  description: Tên người dùng
                  type: string
                email:
                  format: email
                  description: Địa chỉ email
                  type: string
                password:
                  description: Mật khẩu (tối thiểu 6 ký tự)
                  type: string
                confirmPassword:
                  description: Xác nhận mật khẩu
                  type: string
                deviceId:
                  description: ID thiết bị IoT (nếu có)
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - confirmPassword
              properties:
                username:
                  description: Tên người dùng
                  type: string
                email:
                  format: email
                  description: Địa chỉ email
                  type: string
                password:
                  description: Mật khẩu (tối thiểu 6 ký tự)
                  type: string
                confirmPassword:
                  description: Xác nhận mật khẩu
                  type: string
                deviceId:
                  description: ID thiết bị IoT (nếu có)
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - confirmPassword
              properties:
                username:
                  description: Tên người dùng
                  type: string
                email:
                  format: email
                  description: Địa chỉ email
                  type: string
                password:
                  description: Mật khẩu (tối thiểu 6 ký tự)
                  type: string
                confirmPassword:
                  description: Xác nhận mật khẩu
                  type: string
                deviceId:
                  description: ID thiết bị IoT (nếu có)
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  token:
                    type: string
        "400":
          description: Response for status 400
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
      operationId: postApiAuthRegister
  /api/auth/verify-email:
    get:
      tags:
        - Authentication
      summary: Xác minh email
      description: Xác minh địa chỉ email người dùng bằng token được gửi trong email.
        Trả về JWT token khi thành công.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            description: Email verification token
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  token:
                    type: string
        "400":
          description: Response for status 400
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
      operationId: getApiAuthVerify-email
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      description: Đăng nhập bằng email và mật khẩu. Trả về JWT token nếu thành công.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  format: email
                  description: Địa chỉ email
                  type: string
                password:
                  description: Mật khẩu
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  format: email
                  description: Địa chỉ email
                  type: string
                password:
                  description: Mật khẩu
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  format: email
                  description: Địa chỉ email
                  type: string
                password:
                  description: Mật khẩu
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  token:
                    type: string
        "400":
          description: Response for status 400
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
      operationId: postApiAuthLogin
  /api/auth/logout:
    post:
      operationId: postApiAuthLogout
  /api/posts/upload-url:
    post:
      tags:
        - Posts
      summary: Tạo URL upload MinIO
      description: Trả về presigned URL để upload ảnh lên MinIO/S3
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentType
              properties:
                contentType:
                  description: "MIME type, vd: image/png"
                  type: string
                extension:
                  description: "Phần mở rộng file, vd: png"
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - contentType
              properties:
                contentType:
                  description: "MIME type, vd: image/png"
                  type: string
                extension:
                  description: "Phần mở rộng file, vd: png"
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - contentType
              properties:
                contentType:
                  description: "MIME type, vd: image/png"
                  type: string
                extension:
                  description: "Phần mở rộng file, vd: png"
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - uploadUrl
                  - key
                  - url
                properties:
                  uploadUrl:
                    type: string
                  key:
                    type: string
                  url:
                    type: string
      operationId: postApiPostsUpload-url
  /api/posts/:
    post:
      tags:
        - Posts
      summary: Tạo bài viết với AQI từ userInfo
      description: Tạo bài viết mới, AQI sẽ được lấy tự động từ dữ liệu mới nhất của
        device (userInfo). Nếu có aqiIndex trong body sẽ dùng giá trị đó.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
                - location
              properties:
                title:
                  minLength: 1
                  maxLength: 255
                  type: string
                content:
                  minLength: 1
                  maxLength: 5000
                  type: string
                aqiIndex:
                  minimum: 0
                  maximum: 500
                  type: number
                location:
                  type: object
                  required:
                    - lat
                    - lng
                  properties:
                    lat:
                      description: Vĩ độ
                      type: number
                    lng:
                      description: Kinh độ
                      type: number
                    name:
                      description: Tên địa điểm
                      type: string
                media:
                  type: array
                  items:
                    type: object
                    required:
                      - key
                      - url
                    properties:
                      key:
                        description: Object key trên S3/MinIO
                        type: string
                      url:
                        description: Public URL của file
                        type: string
                      contentType:
                        type: string
                      size:
                        type: number
                      width:
                        type: number
                      height:
                        type: number
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - title
                - content
                - location
              properties:
                title:
                  minLength: 1
                  maxLength: 255
                  type: string
                content:
                  minLength: 1
                  maxLength: 5000
                  type: string
                aqiIndex:
                  minimum: 0
                  maximum: 500
                  type: number
                location:
                  type: object
                  required:
                    - lat
                    - lng
                  properties:
                    lat:
                      description: Vĩ độ
                      type: number
                    lng:
                      description: Kinh độ
                      type: number
                    name:
                      description: Tên địa điểm
                      type: string
                media:
                  type: array
                  items:
                    type: object
                    required:
                      - key
                      - url
                    properties:
                      key:
                        description: Object key trên S3/MinIO
                        type: string
                      url:
                        description: Public URL của file
                        type: string
                      contentType:
                        type: string
                      size:
                        type: number
                      width:
                        type: number
                      height:
                        type: number
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - content
                - location
              properties:
                title:
                  minLength: 1
                  maxLength: 255
                  type: string
                content:
                  minLength: 1
                  maxLength: 5000
                  type: string
                aqiIndex:
                  minimum: 0
                  maximum: 500
                  type: number
                location:
                  type: object
                  required:
                    - lat
                    - lng
                  properties:
                    lat:
                      description: Vĩ độ
                      type: number
                    lng:
                      description: Kinh độ
                      type: number
                    name:
                      description: Tên địa điểm
                      type: string
                media:
                  type: array
                  items:
                    type: object
                    required:
                      - key
                      - url
                    properties:
                      key:
                        description: Object key trên S3/MinIO
                        type: string
                      url:
                        description: Public URL của file
                        type: string
                      contentType:
                        type: string
                      size:
                        type: number
                      width:
                        type: number
                      height:
                        type: number
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - userId
                  - author
                  - title
                  - content
                  - aqiIndex
                  - location
                  - upVotes
                  - downVotes
                  - createdAt
                  - updatedAt
                  - media
                properties:
                  id:
                    type: string
                  userId:
                    type: string
                  author:
                    type: object
                    required:
                      - id
                      - username
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      avatarUrl:
                        type: string
                  title:
                    type: string
                  content:
                    type: string
                  aqiIndex:
                    type: number
                  location:
                    type: object
                    required:
                      - lat
                      - lng
                    properties:
                      lat:
                        description: Vĩ độ
                        type: number
                      lng:
                        description: Kinh độ
                        type: number
                      name:
                        description: Tên địa điểm
                        type: string
                  upVotes:
                    type: number
                  downVotes:
                    type: number
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  media:
                    type: array
                    items:
                      type: object
                      required:
                        - key
                        - url
                      properties:
                        key:
                          description: Object key trên S3/MinIO
                          type: string
                        url:
                          description: Public URL của file
                          type: string
                        contentType:
                          type: string
                        size:
                          type: number
                        width:
                          type: number
                        height:
                          type: number
      operationId: postApiPosts
    get:
      tags:
        - Posts
      summary: Danh sách bài viết
      description: Liệt kê các bài viết mới nhất kèm media và chỉ số AQI.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: number
        - name: offset
          in: query
          required: false
          schema:
            minimum: 0
            default: 0
            type: number
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - userId
                        - author
                        - title
                        - content
                        - aqiIndex
                        - location
                        - upVotes
                        - downVotes
                        - createdAt
                        - updatedAt
                        - media
                      properties:
                        id:
                          type: string
                        userId:
                          type: string
                        author:
                          type: object
                          required:
                            - id
                            - username
                          properties:
                            id:
                              type: string
                            username:
                              type: string
                            avatarUrl:
                              type: string
                        title:
                          type: string
                        content:
                          type: string
                        aqiIndex:
                          type: number
                        location:
                          type: object
                          required:
                            - lat
                            - lng
                          properties:
                            lat:
                              description: Vĩ độ
                              type: number
                            lng:
                              description: Kinh độ
                              type: number
                            name:
                              description: Tên địa điểm
                              type: string
                        upVotes:
                          type: number
                        downVotes:
                          type: number
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        media:
                          type: array
                          items:
                            type: object
                            required:
                              - key
                              - url
                            properties:
                              key:
                                description: Object key trên S3/MinIO
                                type: string
                              url:
                                description: Public URL của file
                                type: string
                              contentType:
                                type: string
                              size:
                                type: number
                              width:
                                type: number
                              height:
                                type: number
                  total:
                    type: number
      operationId: getApiPosts
  /api/posts/trending:
    get:
      tags:
        - Posts
      summary: Danh sách bài viết nổi bật
      description: Liệt kê các bài viết nổi bật dựa trên số phiếu upvote và downvote,
        kèm media và chỉ số AQI.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: number
        - name: offset
          in: query
          required: false
          schema:
            minimum: 0
            default: 0
            type: number
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - userId
                        - author
                        - title
                        - content
                        - aqiIndex
                        - location
                        - upVotes
                        - downVotes
                        - createdAt
                        - updatedAt
                        - media
                      properties:
                        id:
                          type: string
                        userId:
                          type: string
                        author:
                          type: object
                          required:
                            - id
                            - username
                          properties:
                            id:
                              type: string
                            username:
                              type: string
                            avatarUrl:
                              type: string
                        title:
                          type: string
                        content:
                          type: string
                        aqiIndex:
                          type: number
                        location:
                          type: object
                          required:
                            - lat
                            - lng
                          properties:
                            lat:
                              description: Vĩ độ
                              type: number
                            lng:
                              description: Kinh độ
                              type: number
                            name:
                              description: Tên địa điểm
                              type: string
                        upVotes:
                          type: number
                        downVotes:
                          type: number
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        media:
                          type: array
                          items:
                            type: object
                            required:
                              - key
                              - url
                            properties:
                              key:
                                description: Object key trên S3/MinIO
                                type: string
                              url:
                                description: Public URL của file
                                type: string
                              contentType:
                                type: string
                              size:
                                type: number
                              width:
                                type: number
                              height:
                                type: number
                  total:
                    type: number
      operationId: getApiPostsTrending
  /api/posts/{id}:
    get:
      tags:
        - Posts
      summary: Chi tiết bài viết
      description: Trả về thông tin bài viết kèm media và chỉ số AQI.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - userId
                  - author
                  - title
                  - content
                  - aqiIndex
                  - location
                  - upVotes
                  - downVotes
                  - createdAt
                  - updatedAt
                  - media
                properties:
                  id:
                    type: string
                  userId:
                    type: string
                  author:
                    type: object
                    required:
                      - id
                      - username
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      avatarUrl:
                        type: string
                  title:
                    type: string
                  content:
                    type: string
                  aqiIndex:
                    type: number
                  location:
                    type: object
                    required:
                      - lat
                      - lng
                    properties:
                      lat:
                        description: Vĩ độ
                        type: number
                      lng:
                        description: Kinh độ
                        type: number
                      name:
                        description: Tên địa điểm
                        type: string
                  upVotes:
                    type: number
                  downVotes:
                    type: number
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  media:
                    type: array
                    items:
                      type: object
                      required:
                        - key
                        - url
                      properties:
                        key:
                          description: Object key trên S3/MinIO
                          type: string
                        url:
                          description: Public URL của file
                          type: string
                        contentType:
                          type: string
                        size:
                          type: number
                        width:
                          type: number
                        height:
                          type: number
      operationId: getApiPostsById
  /api/posts/{id}/vote:
    post:
      tags:
        - Posts
      summary: Upvote/Downvote bài viết
      description: Tạo hoặc cập nhật phiếu bầu (up/down) cho bài viết.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  enum:
                    - 1
                    - -1
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  enum:
                    - 1
                    - -1
          multipart/form-data:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  enum:
                    - 1
                    - -1
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - userId
                  - author
                  - title
                  - content
                  - aqiIndex
                  - location
                  - upVotes
                  - downVotes
                  - createdAt
                  - updatedAt
                  - media
                properties:
                  id:
                    type: string
                  userId:
                    type: string
                  author:
                    type: object
                    required:
                      - id
                      - username
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      avatarUrl:
                        type: string
                  title:
                    type: string
                  content:
                    type: string
                  aqiIndex:
                    type: number
                  location:
                    type: object
                    required:
                      - lat
                      - lng
                    properties:
                      lat:
                        description: Vĩ độ
                        type: number
                      lng:
                        description: Kinh độ
                        type: number
                      name:
                        description: Tên địa điểm
                        type: string
                  upVotes:
                    type: number
                  downVotes:
                    type: number
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  media:
                    type: array
                    items:
                      type: object
                      required:
                        - key
                        - url
                      properties:
                        key:
                          description: Object key trên S3/MinIO
                          type: string
                        url:
                          description: Public URL của file
                          type: string
                        contentType:
                          type: string
                        size:
                          type: number
                        width:
                          type: number
                        height:
                          type: number
      operationId: postApiPostsByIdVote
  /api/shop/products:
    get:
      tags:
        - Shop
      summary: Danh sách sản phẩm
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: number
        - name: offset
          in: query
          required: false
          schema:
            minimum: 0
            default: 0
            type: number
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - description
                        - price
                        - stock
                        - imageUrl
                        - categories
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        price:
                          type: number
                        stock:
                          type: number
                        imageUrl:
                          anyOf:
                            - type: string
                            - type: "null"
                        categories:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                              - name
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                  total:
                    type: number
      operationId: getApiShopProducts
    post:
      tags:
        - Shop
      summary: Tạo sản phẩm mới (Admin only)
